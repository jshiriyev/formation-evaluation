# Publish the web apps to GitHub Pages at https://jshiriyev.github.io/formation-evaluation/
#   index.html   the app hub, one card per app
#   pages/       the apps (every pages/*.html is published)
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# The site mirrors the repository paths, so the relative links in the pages work the same
# on Pages as from a local server at the repository root (e.g. the WellView sample log at
# ../notebooks/tutorial_3_graph_2.LAS). Any other file a page links to must be copied in
# "Assemble the site"; the link check fails the run when one is missing.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "pages/**"
      - "notebooks/tutorial_3_graph_2.LAS"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Assemble the site
        run: |
          mkdir -p _site/pages _site/notebooks
          cp index.html _site/
          cp pages/*.html _site/pages/
          cp notebooks/tutorial_3_graph_2.LAS _site/notebooks/

      - name: Check the links between published files
        run: |
          # Relative href/src attributes and *_URL = '...' constants must resolve inside _site.
          status=0
          while IFS= read -r page; do
            while IFS= read -r link; do
              target="$(dirname "$page")/$link"
              [[ $link == */ ]] && target="${target}index.html"
              if [ ! -f "$target" ]; then
                echo "::error file=${page#_site/}::$link is not published"
                status=1
              fi
            done < <(grep -oE "(href|src)=\"[^\"]*\"|_URL = '[^']*'" "$page" \
                       | sed -E "s/^[^\"']*[\"']//; s/[\"']\$//; s/[?#].*//" \
                       | grep -vE '^$|^[a-z]+:|^//' || true)
          done < <(find _site -name '*.html')
          find _site -type f | sort
          exit $status

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
